repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: "0c47f153e36705819b4d819508fa913d979c1ccc"  # frozen: v4.19.3
    hooks:
      - id: commitizen
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/andreoliwa/nitpick
    rev: "3ba97e5d57882cca6ef1eccaae683753c8a26630"  # frozen: v0.38.1
    hooks:
      - id: nitpick
  - repo: "https://github.com/TotallyNotRobots/check-spdx-header"
    rev: '7b32924b95a8a529c388fd5abf41dcca901b42bc'  # frozen: 0.3.2
    hooks:
      - id: fix-spdx-header
  - repo: https://github.com/ikamensh/flynt
    rev: "97be693bf18bc2f050667dd282d243e2824b81e2"  # frozen: 1.0.6
    hooks:
      - id: flynt
  - repo: https://github.com/codespell-project/codespell
    rev: '57b21406f092110c18776e39b0bda50d37c945c8'  # frozen: v2.4.3
    hooks:
      - additional_dependencies:
          - tomli ; python_version < '3.11'
        id: codespell
  - repo: https://github.com/asottile/pyupgrade
    rev: 'f22ea0651f4355c655cc581f67813c991c74a312'  # frozen: v3.22.0
    hooks:
      - id: pyupgrade
        args:
          - --py310-plus
  - repo: https://github.com/PyCQA/autoflake
    rev: 6d9dd2716540ab776f29c7b896cd3052ef4619b2  # frozen: v2.4.0
    hooks:
      - id: autoflake

  - repo: local
    hooks:
      - id: hatch-types
        name: hatch types
        entry: hatch run types:check
        language: system
        types:
          - python
        pass_filenames: true
  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: '1743edbed52f3d61886b59d98a27164a8af29c0d'  # frozen: 0.4.1
    hooks:
      - id: auto-walrus
        additional_dependencies:
          - tomli ; python_version < '3.11'
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: '4380fbb73a154b5f5624794c1c78d9719ccc860f'  # frozen: v2.16.0
    hooks:
      - id: pretty-format-toml
        args:
          - --autofix
          - --no-sort
          - --trailing-commas
          - --indent
          - '4'
          - --inline-comment-spaces
          - '1'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: '25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c'  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
minimum_pre_commit_version: 4.3.0
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
