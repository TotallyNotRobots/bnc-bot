repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: "3d7386012109c403d56375314125c20e102e75c0"  # frozen: v4.18.0
    hooks:
      - id: commitizen
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: "87928e6d6761a4a6d22250e1fee5601b3998086e"  # frozen: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: "d5f40fa0553aa4bba71fcd73cf42933ae14d5116"  # frozen: 9.0.0b5
    hooks:
      - id: isort
  - repo: https://github.com/andreoliwa/nitpick
    rev: "3ba97e5d57882cca6ef1eccaae683753c8a26630"  # frozen: v0.38.1
    hooks:
      - id: nitpick
  - repo: "https://github.com/TotallyNotRobots/check-spdx-header"
    rev: '7b32924b95a8a529c388fd5abf41dcca901b42bc'  # frozen: 0.3.2
    hooks:
      - id: fix-spdx-header
  - repo: https://github.com/ikamensh/flynt
    rev: "97be693bf18bc2f050667dd282d243e2824b81e2"  # frozen: 1.0.6
    hooks:
      - id: flynt
  - repo: https://github.com/codespell-project/codespell
    rev: '57b21406f092110c18776e39b0bda50d37c945c8'  # frozen: v2.4.3
    hooks:
      - additional_dependencies:
          - tomli ; python_version < '3.11'
        id: codespell
  - repo: https://github.com/asottile/pyupgrade
    rev: '75992aaa40730136014f34227e0135f63fc951b4'  # frozen: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py310-plus
  - repo: https://github.com/PyCQA/autoflake
    rev: 2d3853a9f31d97783fb2e181d41cd82a6babd666  # frozen: v2.3.3
    hooks:
      - id: autoflake

  - repo: local
    hooks:
      - id: hatch-fmt
        name: hatch fmt
        entry: hatch fmt --check
        language: system
        types:
          - python
        pass_filenames: true
      - id: hatch-types
        name: hatch types
        entry: hatch run types:check
        language: system
        types:
          - python
        pass_filenames: true
  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: '1743edbed52f3d61886b59d98a27164a8af29c0d'  # frozen: 0.4.1
    hooks:
      - id: auto-walrus
        additional_dependencies:
          - tomli ; python_version < '3.11'
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: '4380fbb73a154b5f5624794c1c78d9719ccc860f'  # frozen: v2.16.0
    hooks:
      - id: pretty-format-toml
        args:
          - --autofix
          - --no-sort
          - --trailing-commas
          - --indent
          - '4'
          - --inline-comment-spaces
          - '1'
minimum_pre_commit_version: 4.3.0
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
